<style>
:root { --bg: #060606; --surface: #0a0a0a; --text: #e2e8f0; --dim: #64748b; --accent: #00ff88; --border: #1e293b; --error: #ff3366; --warn: #fbbf24; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
.term-bar { display: flex; align-items: center; gap: 0.5rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); }
.term-dot { width: 10px; height: 10px; border-radius: 50%; opacity: 0.6; }
.term-dot.r { background: var(--error); }
.term-dot.y { background: var(--warn); }
.term-dot.g { background: var(--accent); }
.term-bar a { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--dim); text-decoration: none; transition: color 0.2s; }
.term-bar a:hover { color: var(--accent); }
.container { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
h1, h2, h3, h4 { font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--accent); }
h2 { font-size: 1.3rem; margin: 2rem 0 1rem; color: var(--text); }
h3 { font-size: 1.05rem; margin: 1.5rem 0 0.75rem; color: var(--warn); }
p { margin-bottom: 1rem; color: var(--dim); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { margin: 1rem 0 1rem 1.5rem; color: var(--dim); }
li { margin: 0.35rem 0; }
code { font-family: 'JetBrains Mono', monospace; background: var(--surface); border: 1px solid var(--border); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85em; color: var(--accent); }
pre { background: var(--surface); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1rem 0; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
pre code { background: none; border: none; padding: 0; color: var(--text); }
img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; }
table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
th, td { padding: 0.6rem; text-align: left; border-bottom: 1px solid var(--border); }
th { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin: 1rem 0; }
.card h3 { margin-top: 0; }
hr { border: none; border-top: 1px dashed var(--border); margin: 2rem 0; }
footer { text-align: center; padding: 2rem; font-size: 0.75rem; color: var(--dim); border-top: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
@media (max-width: 600px) { .container { padding: 2rem 1rem; } h1 { font-size: 1.4rem; } }
