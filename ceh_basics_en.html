                                    </button>
                                ))}
                                <hr className="border-slate-800 my-2"/>
                                <button onClick={() => { toggleLang(); setIsMobileMenuOpen(false); }} className="px-4 py-3 rounded-lg text-left text-sm font-medium text-purple-400 hover:bg-purple-900/20 flex items-center gap-2">
                                    <Languages className="w-4 h-4" />
                                    {content.langLabel}
                                </button>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const App = () => {
            const [activeSection, setActiveSection] = useState('intro');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [lang, setLang] = useState('en');

            const toggleLang = () => setLang(prev => prev === 'en' ? 'si' : 'en');
            const t = CONTENT[lang];

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    setActiveSection(id);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-300 font-sans selection:bg-cyan-500/30">
                    <NavBar content={t.nav} activeSection={activeSection} scrollToSection={scrollToSection} isMobileMenuOpen={isMobileMenuOpen} setIsMobileMenuOpen={setIsMobileMenuOpen} lang={lang} toggleLang={toggleLang} />
                    <main className="max-w-4xl mx-auto px-4 pt-24 pb-20">
                        <section id="intro" className="text-center py-16 mb-12 border-b border-slate-800">
                            <h1 className="text-4xl md:text-6xl font-extrabold text-white mb-6 tracking-tight">
                                {t.header.title} <br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">{t.header.subtitle}</span>
                            </h1>
                            <p className="text-lg text-slate-400 max-w-2xl mx-auto mb-8">{t.header.desc}</p>
                            <div className="flex justify-center gap-4">
                                <button onClick={() => scrollToSection('mod1')} className="px-8 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg transition-all transform hover:-translate-y-1 shadow-lg shadow-cyan-500/20">{t.header.cta}</button>
                            </div>
                        </section>
                        {t.modules.map((mod) => (
                            <CourseModule key={mod.id} id={mod.id} title={mod.title} icon={mod.icon} color={mod.color}>
                                {mod.cards.map((card, index) => (
                                    <ConceptCard key={index} data={card} labels={t.labels} icon={card.icon} />
                                ))}
                            </CourseModule>
                        ))}
                        <footer className="text-center text-slate-500 pt-12 border-t border-slate-800">
                            <p>© Ethical Hacking Fundamentals. {lang === 'en' ? 'Built for the curious.' : 'කුතුහලයෙන් පිරි අය වෙනුවෙන් නිර්මාණය කරන ලදී.'} | Based on content from hackandbuild.dev</p>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
